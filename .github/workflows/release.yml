name: Release
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

env:
  CARGO_INCREMENTAL: 0
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-tauri:
    name: Build Tauri (${{ matrix.platform.label }})
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - { runner: windows-latest,  target: 'x86_64-pc-windows-msvc',   label: 'Windows x64'   }
          - { runner: macos-latest,     target: 'aarch64-apple-darwin',      label: 'macOS ARM64'   }
          - { runner: macos-latest,     target: 'x86_64-apple-darwin',        label: 'macOS x64'     }
          - { runner: ubuntu-22.04,     target: 'x86_64-unknown-linux-gnu',  label: 'Linux x64'     }

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          # 官方 main 分支缺少 src-tauri/crates/models，代码不完整无法构建；
          # 改用官方最后一个可构建的标签 v2.2.0 源码。
          # fork 里没有 v2.2.0 标签，所以直接从上游仓库拉取（公开仓库无需登录）。
          repository: Agions/fablr
          ref: v2.2.0

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'

      # 修复 v2.2.0 内嵌配置 bug：
      # tauri-plugin-global-shortcut/notification/clipboard-manager 新版本要求无配置，
      # 旧打包配置 {"all": true} 会导致程序启动即崩溃，构建前删掉这三段。
      # 用 Node.js 写 JSON（三个平台都保证有 node，且避免 shell 语法差异）。
      - name: Fix tauri.conf.json plugin config
        run: |
          node -e "const fs=require('fs');const p='src-tauri/tauri.conf.json';let d=JSON.parse(fs.readFileSync(p,'utf8'));let pl=d.plugins||{};for(const k of ['global-shortcut','notification','clipboard-manager'])delete pl[k];if(Object.keys(pl).length===0)delete d.plugins;fs.writeFileSync(p,JSON.stringify(d,null,2)+'\n');console.log('tauri.conf.json fixed, plugins left:',Object.keys(d.plugins||{}))"

      - name: Install Linux dependencies
        if: contains(matrix.platform.runner, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.88.0
          target: ${{ matrix.platform.target }}

      - name: Install dependencies
        run: |
          npm install -g npm@9 --silent
          node -e "const fs=require('fs');const p='package-lock.json';let s=fs.readFileSync(p,'utf8');const n=s.replace(/https?:\/\/mirrors\.tencentyun\.com\/npm\//g,'https://registry.npmjs.org/').replace(/https?:\/\/registry\.npmmirror\.com\//g,'https://registry.npmjs.org/');if(n!==s){fs.writeFileSync(p,n);console.log('package-lock.json registry fixed');}else{console.log('package-lock.json already clean');}"
          npm ci --no-audit --no-fund
          # 与 Cargo.lock 对齐（同 minor 即可）：rust tauri 2.11.2/dialog 2.7.1/fs 2.5.1，
          # npm 上对应 api 最新为 2.11.1（不存在 2.11.2，装错版本会导致前端解析失败）
          npm install --no-audit --no-fund @tauri-apps/api@2.11.1 @tauri-apps/plugin-dialog@2.7.1 @tauri-apps/plugin-fs@2.5.1
          npm ls @tauri-apps/api @tauri-apps/plugin-dialog @tauri-apps/plugin-fs

      # Only one job creates the GitHub Release (macOS ARM64 runs first by alphabet)
      - name: Create GitHub Release
        if: matrix.platform.label == 'macOS ARM64'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${GITHUB_REF#refs/tags/v}"
          gh release create "${{ github.ref_name }}" \
            --title "v$VERSION" \
            --draft \
            --notes "" \
            --repo ${{ github.repository }}
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Create macOS run instructions
        if: matrix.platform.label == 'macOS ARM64' || matrix.platform.label == 'macOS x64'
        run: |
          cat > "HOW-TO-RUN.txt" << 'RUNEOF'
          === Fablr macOS Installation Instructions ===

          Because Fablr is not signed with an Apple Developer certificate,
          you must explicitly allow it to run on your Mac:

          METHOD 1 — Easiest (Recommended):
          1. Right-click on Fablr.app
          2. Select "Open" from the context menu
          3. macOS will show a warning popup
          4. Click "Open Anyway"
          5. Fablr will launch ✅

          METHOD 2 — Terminal:
          1. Open Terminal (Applications → Utilities → Terminal)
          2. Copy and paste this command:
             sudo xattr -rd com.apple.quarantine "/Applications/Fablr.app"
          3. Press Enter, enter your password when prompted
          4. Launch Fablr from Applications normally

          METHOD 3 — System Settings:
          1. Try to open Fablr (double-click)
          2. Go to System Settings → Privacy & Security
          3. Scroll down to "Security policy" section
          4. Click "Open Anyway" next to Fablr
          5. Launch Fablr again

          For more help: https://github.com/Agions/fablr/releases
          RUNEOF

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # 手动触发时没有真实版本号，去掉 tagName/releaseName，
          # 让 tauri-action 只构建不上传 release（避免 "main" 当标签创建失败导致整个任务失败）。
          args: --target ${{ matrix.platform.target }}

      # 这个步骤是 bash 语法（find/cp/while），Windows 运行器默认是 PowerShell，
      # 所以显式指定 shell: bash（Windows 上有 Git Bash，Linux/macOS 本来就是 bash）。
      - name: Copy run instructions and user manuals to bundle
        shell: bash
        run: |
          find src-tauri/target/${{ matrix.platform.target }}/release/bundle -name "*.app" -type d | while read app_path; do
            parent_dir=$(dirname "$app_path")
            cp HOW-TO-RUN.txt "$parent_dir/HOW-TO-RUN.txt" 2>/dev/null || true
            cp docs/dist-manual/USER_MANUAL.md "$parent_dir/USER_MANUAL.md" 2>/dev/null || true
            cp docs/dist-manual/USER_MANUAL.txt "$parent_dir/USER_MANUAL.txt" 2>/dev/null || true
            echo "Copied manuals to $parent_dir"
          done
          # Copy to target bundle root for all installers
          cp docs/dist-manual/USER_MANUAL.md src-tauri/target/${{ matrix.platform.target }}/release/bundle/USER_MANUAL.md 2>/dev/null || true
          cp docs/dist-manual/USER_MANUAL.txt src-tauri/target/${{ matrix.platform.target }}/release/bundle/USER_MANUAL.txt 2>/dev/null || true

      - name: Package macOS app bundle
        if: matrix.platform.label == 'macOS ARM64' || matrix.platform.label == 'macOS x64'
        run: |
          APP_PATH=$(find src-tauri/target/${{ matrix.platform.target }}/release/bundle -name "*.app" -type d | head -1)
          echo "Found app: $APP_PATH"
          7z a -tzip "fablr-${{ matrix.platform.label }}.zip" "$APP_PATH" "docs/dist-manual/USER_MANUAL.md" "docs/dist-manual/USER_MANUAL.txt" "HOW-TO-RUN.txt"
          echo "Packaged: fablr-${{ matrix.platform.label }}.zip"
          ls -lh "fablr-${{ matrix.platform.label }}.zip"

      - name: Package Linux AppImage
        if: matrix.platform.label == 'Linux x64' || matrix.platform.label == 'Linux ARM64'
        run: |
          APPIMAGE=$(find src-tauri/target/${{ matrix.platform.target }}/release/bundle -name "*.AppImage" | head -1)
          echo "Found: $APPIMAGE"
          SIZE=$(stat -c %s "$APPIMAGE" 2>/dev/null || stat -f %z "$APPIMAGE")
          echo "Original size: $(echo "scale=1; $SIZE/1024/1024/1024" | bc) GB"
          # Compress if larger than 1.5 GB (stay safely under 2 GB GitHub limit)
          if [ "$SIZE" -gt 1610612736 ]; then
            echo "Large AppImage — compressing with 7z..."
            7z a -t7z "fablr-${{ matrix.platform.label }}.7z" "$APPIMAGE" -mx9
            ls -lh "fablr-${{ matrix.platform.label }}.7z"
          else
            mv "$APPIMAGE" "fablr-${{ matrix.platform.label }}.AppImage"
            ls -lh "fablr-${{ matrix.platform.label }}.AppImage"
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v5
        with:
          name: Fablr-${{ matrix.platform.label }}
          path: |
            src-tauri/target/${{ matrix.platform.target }}/release/bundle/**/*.exe
            src-tauri/target/${{ matrix.platform.target }}/release/bundle/**/*.msi
            src-tauri/target/${{ matrix.platform.target }}/release/bundle/**/*.deb
            src-tauri/target/${{ matrix.platform.target }}/release/bundle/**/*.rpm
            src-tauri/target/${{ matrix.platform.target }}/release/bundle/**/*.AppImage
            fablr-${{ matrix.platform.label }}.zip
            fablr-${{ matrix.platform.label }}.7z
            HOW-TO-RUN.txt
            docs/dist-manual/USER_MANUAL.md
            docs/dist-manual/USER_MANUAL.txt
          retention-days: 7

  upload-assets:
    name: Upload Release Assets
    needs: [build-tauri]
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v5
        with:
          path: artifacts

      - name: List artifacts
        run: |
          echo "=== All artifacts ==="
          find artifacts -type f | while read f; do echo "$f ($(du -h "$f" | cut -f1))"; done

      - name: Upload to GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          find artifacts -type f \( -name "*.exe" -o -name "*.msi" -o -name "*.zip" -o -name "*.7z" -o -name "*.dmg" -o -name "*.deb" -o -name "*.AppImage" -o -name "HOW-TO-RUN.txt" -o -name "USER_MANUAL.md" -o -name "USER_MANUAL.txt" \) -print0 | while IFS= read -r -d '' artifact; do
            echo "Uploading $artifact..."
            gh release upload "${{ github.ref_name }}" "$artifact" --clobber --repo ${{ github.repository }}
          done

      - name: Publish Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view "${{ github.ref_name }}" --repo ${{ github.repository }} --json uploadUrl --jq .uploadUrl
          gh release edit "${{ github.ref_name }}" --draft=false --repo ${{ github.repository }}
